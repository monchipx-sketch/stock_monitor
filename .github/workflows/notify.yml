name: Stock Technical Alert & Result

on:
  schedule:
    # 協定世界時(UTC) 02:31 ＝ 日本時間(JST) 平日11:31（昼休み速報）
    - cron: '31 2 * * 1-5'
    # 協定世界時(UTC) 06:45 ＝ 日本時間(JST) 平日15:45（後場結果シミュレーション）
    - cron: '45 6 * * 1-5'
  workflow_dispatch: # 手動実行用ボタン

jobs:
  alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests pytz

      - name: Run script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main.py

          